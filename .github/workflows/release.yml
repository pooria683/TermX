
name: TermX - Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:

  # =========================
  # WINDOWS BUILD
  # =========================
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get Version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml -Raw
          $version = [regex]::Match(
            $content,
            '(?m)^version\s*=\s*"([^"]+)"'
          ).Groups[1].Value

          if (-not $version) {
            throw "Version not found in pyproject.toml"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build Application
        run: |
          pyinstaller TermX.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Create Installer Script
        shell: pwsh
        run: |
          @'
          [Setup]
          AppId={{B6C87C4A-4C75-4A5A-9B32-TERMXX10001}
          AppName=TermX
          AppVersion={#AppVersion}
          AppPublisher=TermX
          DefaultDirName={autopf}\TermX
          DefaultGroupName=TermX
          OutputDir=installer
          OutputBaseFilename=TermX-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; Flags: unchecked

          [Files]
          Source: "dist\TermX\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\TermX"; Filename: "{app}\TermX.exe"
          Name: "{autodesktop}\TermX"; Filename: "{app}\TermX.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\TermX.exe"; Description: "Launch TermX"; Flags: postinstall nowait skipifsilent
          '@ | Set-Content installer.iss -Encoding UTF8

          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Windows
          path: installer/TermX-Setup.exe

  # =========================
  # LINUX BUILD
  # =========================
  linux:
    name: Build Linux Packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-image0 \
            libxcb-render-util0 \
            libgl1 \
            desktop-file-utils \
            zsync

          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build Application
        run: |
          pyinstaller TermX.spec --noconfirm --clean

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin

          cp -r dist/TermX/. AppDir/usr/bin/

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/TermX" "$@"
          EOF

          chmod +x AppDir/AppRun

          cat > AppDir/TermX.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TermX
          Comment=AI-powered terminal assistant
          Exec=TermX
          Icon=termx
          Categories=Development;Utility;
          Terminal=false
          EOF

          cat > AppDir/termx.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
            <rect width="256" height="256" rx="48" fill="#111827"/>
            <path d="M55 65 L115 128 L55 191" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M125 190 H205" stroke="#22c55e" stroke-width="20" stroke-linecap="round"/>
          </svg>
          EOF

          ln -sf termx.svg AppDir/.DirIcon

          chmod +x AppDir/AppRun

          wget -q \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -O appimagetool

          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool AppDir TermX-x86_64.AppImage

      - name: Create Debian Package
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          mkdir -p deb/DEBIAN
          mkdir -p deb/opt/termx
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/scalable/apps

          cp -r dist/TermX/. deb/opt/termx/

          cat > deb/DEBIAN/control <<EOF
          Package: termx
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: TermX
          Description: AI-powered terminal assistant
          EOF

          cat > deb/usr/share/applications/termx.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TermX
          Comment=AI-powered terminal assistant
          Exec=/opt/termx/TermX
          Icon=termx
          Categories=Development;Utility;
          Terminal=false
          EOF

          cp AppDir/termx.svg deb/usr/share/icons/hicolor/scalable/apps/termx.svg

          dpkg-deb --root-owner-group --build deb termx.deb

      - name: Upload Linux Packages
        uses: actions/upload-artifact@v4
        with:
          name: TermX-Linux
          path: |
            TermX-x86_64.AppImage
            termx.deb

  # =========================
  # GITHUB RELEASE
  # =========================
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download All Builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/TermX-Setup.exe
            release-assets/TermX-x86_64.AppImage
            release-assets/termx.deb
